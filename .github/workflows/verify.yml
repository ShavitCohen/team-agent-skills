# Full check (playbook §75), once a day and on demand: ./sync.sh writes the
# shared components into the packages, ./verify.sh skills/* checks them (failing
# on any copy that drifts from its master under shared/) and runs each package's
# tests/validate.sh, and tests/shared-sources.sh checks sync, drift detection and
# install, on Ubuntu and macOS. Every push runs only the impacted checks, in
# groups, in impacted-tests.yml. No secrets and read-only permissions. On failure
# the run summary names the failing runner, the failures and the likely cause.
# Reproduce locally with: ./sync.sh && ./verify.sh skills/* && tests/shared-sources.sh
name: verify

on:
  # 16:30 UTC = 23:30 BKK, end of the working day.
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-os:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure rsync
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # The system rsync may be openrsync, which lacks options the tests use.
            brew install rsync
          elif ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y rsync
          fi
          rsync --version | head -1
      - name: ./sync.sh
        run: |
          set -o pipefail
          ./sync.sh 2>&1 | tee -a "$RUNNER_TEMP/group.log"
      - name: ./verify.sh skills/* (fails on shared-component drift)
        run: |
          set -o pipefail
          ./verify.sh skills/* 2>&1 | tee -a "$RUNNER_TEMP/group.log"
      - name: tests/shared-sources.sh
        run: |
          set -o pipefail
          tests/shared-sources.sh 2>&1 | tee -a "$RUNNER_TEMP/group.log"
      - name: Failure analysis
        if: failure()
        run: bash .github/scripts/ci-failure-report.sh "full check (${{ matrix.os }})" "$RUNNER_TEMP/group.log"

  # One stable check name, `verify`: green only when every runner in the matrix
  # passed. Each runner's failure analysis is in its own job summary.
  verify:
    name: verify
    needs: verify-os
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All runners passed
        env:
          RESULT: ${{ needs.verify-os.result }}
        run: |
          echo "matrix result: $RESULT"
          test "$RESULT" = success
